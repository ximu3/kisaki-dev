packages:
  - packages/*
  - clients/desktop/app
  - clients/desktop/packages/*
autoInstallPeers: false

catalog:
  '@types/node': 24.19.2
  electron: 45.3.2
  solid-js: 1.9.19
  typescript: 7.1.0-beta
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: 1.6.0
  vite-plugin-solid: 2.11.16
  vitest: 5.1.0

overrides:
  vite: 'catalog:'
  vitest: 'catalog:'

# dependency-cruiser 18 extracts type-only edges using the pre-7 compiler API.
packageExtensions:
  dependency-cruiser@18:
    dependencies:
      typescript: 6.0.3

peerDependencyRules:
  # The Vite+ core exposes Vite's APIs under the suite's own version.
  allowedVersions:
    vite: 1.6.0

allowBuilds:
  '@parcel/watcher': false
  better-sqlite3: false
  electron: true
  electron-winstaller: false
  esbuild: true
  sharp: true

minimumReleaseAgeExclude:
  - '@zip.js/zip.js@2.25.0'
  - electron@45.3.2
