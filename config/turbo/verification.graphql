# Queries affected verification tasks with their owning packages, runnable commands and change
# reasons.

query Verification($base: String!, $head: String!) {
  affectedTasks(
    base: $base
    head: $head
    tasks: ["test", "test:native", "test:e2e", "test:dev", "test:artifacts", "test:consumers"]
  ) {
    items {
      name
      fullName
      command
      package {
        name
        path
      }
      reason {
        __typename
      }
    }
  }
}
