# Selects and runs repository checks with their reference environment, cache and reports.

name: Repository verification
on:
  workflow_call:
    inputs:
      base:
        description: Git revision to compare against; missing baselines request complete checks.
        type: string
        default: ''
      head:
        description: Exact Git revision to check out and verify.
        type: string
        required: true
      complete:
        description: Run every applicable check owned by this workflow.
        type: boolean
        default: false
    outputs:
      selected:
        description: Repository checks run for every code verification.
        value: 'true'
      verified:
        description: Completion marker for successful repository checks.
        value: ${{ jobs.repository.outputs.verified }}
permissions:
  contents: read
env:
  # Optional cache restoration should fall back before consuming the feedback budget.
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
jobs:
  repository:
    name: Checks
    outputs:
      verified: ${{ steps.verified.outputs.verified }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      TURBO_CONCURRENCY: '2'
      TURBO_SCM_BASE: ${{ inputs.base }}
      TURBO_SCM_HEAD: ${{ inputs.head }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.head }}
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          cache: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Record runner environment
        shell: bash
        run: |-
          mkdir -p test-results/verification
          pnpm exec tsx tools/host-environment.ts > test-results/verification/host.json
      - name: Select checks
        id: affected
        shell: bash
        env:
          REQUEST_COMPLETE: ${{ inputs.complete }}
        run: |
          complete="$REQUEST_COMPLETE"
          if [[ -z "$TURBO_SCM_BASE" || "$TURBO_SCM_BASE" == 0000000000000000000000000000000000000000 ]] || ! git cat-file -e "$TURBO_SCM_BASE^{commit}"; then
            complete=true
          fi
          if [[ "$complete" == false ]]; then
            orchestration=$(
              git diff --name-only "$TURBO_SCM_BASE" "$TURBO_SCM_HEAD" -- \
                .github/workflows/ci.yml \
                .github/workflows/verification.yml \
                .github/workflows/verification-repository.yml \
                config/turbo/verification.graphql \
                tools/host-environment.ts
            )
            if [[ -n "$orchestration" ]]; then complete=true; fi
          fi
          mkdir -p test-results/verification
          report=test-results/verification/affected.json
          if [[ "$complete" == false ]]; then
            jq -n --arg base "$TURBO_SCM_BASE" --arg head "$TURBO_SCM_HEAD" '{base: $base, head: $head}' > "$RUNNER_TEMP/verification-refs.json"
            pnpm exec turbo query config/turbo/verification.graphql --variables "$RUNNER_TEMP/verification-refs.json" > "$report"
            jq -e '.errors == null and (.data.affectedTasks.items | type == "array")' "$report" > /dev/null
            # Required build prerequisites also use TaskAllChanged; they do not expand verification.
            if jq -e '
              any(.data.affectedTasks.items[];
                .reason.__typename == "TaskGlobalFileChanged" or
                .reason.__typename == "TaskGlobalDepsChanged")
            ' "$report" > /dev/null; then
              complete=true
            fi
          else
            jq -n '{complete: true}' > "$report"
          fi
          echo "complete=$complete" >> "$GITHUB_OUTPUT"
          cp "$GITHUB_OUTPUT" test-results/verification/selected.txt
      - name: Restore Turbo cache
        id: turbo-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .turbo/cache
          key: turbo-v3-repository-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.node-version') }}-${{ github.sha }}
          restore-keys: |
            turbo-v3-repository-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.node-version') }}-
      - name: Check repository
        shell: bash
        env:
          COMPLETE: ${{ steps.affected.outputs.complete }}
        run: |
          selection=()
          if [[ "$COMPLETE" == false ]]; then selection=(--affected); fi
          pnpm typecheck "${selection[@]}" --log-order=stream
          pnpm lint "${selection[@]}" --log-order=stream
          pnpm format:check
          pnpm test "${selection[@]}" --log-order=stream
      - name: Save Turbo cache
        if: steps.turbo-cache.outputs.cache-hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .turbo/cache
          key: ${{ steps.turbo-cache.outputs.cache-primary-key }}
      - name: Upload verification artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: repository-verification
          path: |
            test-results/
          if-no-files-found: error
      - name: Confirm repository checks completed
        id: verified
        run: echo "verified=true" >> "$GITHUB_OUTPUT"
