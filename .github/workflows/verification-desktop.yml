name: Desktop verification
on:
  workflow_call:
    inputs:
      base:
        description: Git revision to compare against; missing baselines request complete checks.
        type: string
        default: ''
      head:
        description: Exact Git revision to check out and verify.
        type: string
        required: true
      complete:
        description: Run every applicable check owned by this workflow.
        type: boolean
        default: false
    outputs:
      selected:
        description: Whether any desktop target requires verification.
        value: ${{ jobs.select.outputs.selected }}
      verified:
        description: Completion marker for an executed target matrix; workflow success covers all targets.
        value: ${{ jobs.desktop.outputs.verified }}
permissions:
  contents: read
env:
  # Optional cache restoration should fall back before consuming the feedback budget.
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
jobs:
  select:
    name: Select checks
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      complete: ${{ steps.affected.outputs.complete }}
      native: ${{ steps.affected.outputs.native }}
      e2e: ${{ steps.affected.outputs.e2e }}
      dev: ${{ steps.affected.outputs.dev }}
      artifacts: ${{ steps.affected.outputs.artifacts }}
      tooling: ${{ steps.affected.outputs.tooling }}
      consumers: ${{ steps.affected.outputs.consumers }}
      selected: ${{ steps.affected.outputs.selected }}
      matrix: ${{ steps.affected.outputs.matrix }}
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      TURBO_CONCURRENCY: '2'
      TURBO_SCM_BASE: ${{ inputs.base }}
      TURBO_SCM_HEAD: ${{ inputs.head }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.head }}
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          cache: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Record runner environment
        shell: bash
        run: |-
          mkdir -p test-results/verification
          pnpm exec tsx tools/host-environment.ts > test-results/verification/host.json
      - name: Select checks
        id: affected
        shell: bash
        env:
          REQUEST_COMPLETE: ${{ inputs.complete }}
          TARGETS: |-
            [
              {"target":"windows-x64","runner":"windows-2025","arch":"x64"},
              {"target":"windows-arm64","runner":"windows-11-arm","arch":"arm64"},
              {"target":"macos-x64","runner":"macos-15-intel","arch":"x64"},
              {"target":"macos-arm64","runner":"macos-15","arch":"arm64"},
              {"target":"linux-x64","runner":"ubuntu-22.04","arch":"x64"},
              {"target":"linux-arm64","runner":"ubuntu-22.04-arm","arch":"arm64"}
            ]
        run: |
          complete="$REQUEST_COMPLETE"
          if [[ -z "$TURBO_SCM_BASE" || "$TURBO_SCM_BASE" == 0000000000000000000000000000000000000000 ]] || ! git cat-file -e "$TURBO_SCM_BASE^{commit}"; then
            complete=true
          fi
          if [[ "$complete" == false ]]; then
            orchestration=$(
              git diff --name-only "$TURBO_SCM_BASE" "$TURBO_SCM_HEAD" -- \
                .github/workflows/ci.yml \
                .github/workflows/verification.yml \
                .github/workflows/verification-desktop.yml \
                config/turbo/verification.graphql \
                tools/host-environment.ts
            )
            if [[ -n "$orchestration" ]]; then complete=true; fi
          fi
          mkdir -p test-results/verification
          report=test-results/verification/affected.json
          if [[ "$complete" == false ]]; then
            jq -n --arg base "$TURBO_SCM_BASE" --arg head "$TURBO_SCM_HEAD" '{base: $base, head: $head}' > "$RUNNER_TEMP/verification-refs.json"
            pnpm exec turbo query config/turbo/verification.graphql --variables "$RUNNER_TEMP/verification-refs.json" > "$report"
            jq -e '.errors == null and (.data.affectedTasks.items | type == "array")' "$report" > /dev/null
            # Required build prerequisites also use TaskAllChanged; they do not expand verification.
            if jq -e '
              any(.data.affectedTasks.items[];
                .reason.__typename == "TaskGlobalFileChanged" or
                .reason.__typename == "TaskGlobalDepsChanged")
            ' "$report" > /dev/null; then
              complete=true
            fi
          else
            jq -n '{complete: true}' > "$report"
          fi
          echo "complete=$complete" >> "$GITHUB_OUTPUT"
          requiresAllTargets=false
          for task in native e2e dev artifacts; do
            selected="$complete"
            if [[ "$complete" == false ]]; then
              selected=$(jq -r --arg task "test:$task" '
                any(.data.affectedTasks.items[];
                  .command != null and
                  .package.name == "@kisaki3/desktop" and
                  .name == $task)
              ' "$report")
            fi
            echo "$task=$selected" >> "$GITHUB_OUTPUT"
            if [[ "$selected" == true ]]; then
              requiresAllTargets=true
            fi
          done
          tooling="$complete"
          if [[ "$complete" == false ]]; then
            tooling=$(jq -r '
              any(.data.affectedTasks.items[];
                .fullName == "@kisaki3/tooling#test" and .command != null)
            ' "$report")
          fi
          echo "tooling=$tooling" >> "$GITHUB_OUTPUT"
          if [[ "$tooling" == true ]]; then requiresAllTargets=true; fi
          consumers="$complete"
          if [[ "$complete" == false ]]; then
            consumers=$(jq -r '
              any(.data.affectedTasks.items[];
                .fullName == "//#root:test:consumers" and .command != null)
            ' "$report")
          fi
          echo "consumers=$consumers" >> "$GITHUB_OUTPUT"
          if [[ "$requiresAllTargets" == true ]]; then
            matrix=$(jq -c . <<< "$TARGETS")
            selected=true
          elif [[ "$consumers" == true ]]; then
            matrix=$(jq -c '[.[] | select(.target == "linux-x64")]' <<< "$TARGETS")
            selected=true
          else
            matrix='[]'
            selected=false
          fi
          echo "selected=$selected" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          cp "$GITHUB_OUTPUT" test-results/verification/selected.txt
      - name: Upload selected scope
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: desktop-scope
          path: test-results/verification/
          if-no-files-found: error
  desktop:
    name: ${{ matrix.target }}
    outputs:
      verified: ${{ steps.verified.outputs.verified }}
    needs: select
    if: needs.select.outputs.selected == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      DESKTOP_TARGET: ${{ matrix.target }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ inputs.head }}
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          architecture: ${{ matrix.arch }}
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          cache: true
      - name: Configure macOS deployment target
        if: runner.os == 'macOS'
        run: echo "MACOSX_DEPLOYMENT_TARGET=13.0" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore Turbo cache
        id: turbo-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .turbo/cache
          key: turbo-v3-desktop-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.node-version') }}-${{ github.sha }}
          restore-keys: |
            turbo-v3-desktop-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.node-version') }}-
      - name: Record runner environment
        shell: bash
        run: |-
          mkdir -p test-results/verification
          pnpm exec tsx tools/host-environment.ts > test-results/verification/host.json
      - name: Install Linux desktop tools
        if: runner.os == 'Linux' && (needs.select.outputs.dev == 'true' || needs.select.outputs.native == 'true' || needs.select.outputs.e2e == 'true' || needs.select.outputs.artifacts == 'true')
        run: sudo apt-get update && sudo apt-get install -y xvfb openbox wmctrl libfuse2 rpm
      - name: Install Chromium
        run: pnpm --filter @kisaki3/desktop exec playwright install --with-deps chromium
        if: needs.select.outputs.dev == 'true' || (needs.select.outputs.consumers == 'true' && matrix.target == 'linux-x64')
      - name: Test public package consumers
        if: needs.select.outputs.consumers == 'true' && matrix.target == 'linux-x64'
        run: pnpm desktop:test:consumers
      - name: Test tooling
        if: needs.select.outputs.tooling == 'true'
        run: pnpm --filter @kisaki3/tooling test --reporter=default --reporter=json --outputFile=test-results/results.json
      - name: Verify selected desktop tasks
        shell: bash
        env:
          TEST_NATIVE: ${{ needs.select.outputs.native }}
          TEST_E2E: ${{ needs.select.outputs.e2e }}
          TEST_DEV: ${{ needs.select.outputs.dev }}
          TEST_ARTIFACTS: ${{ needs.select.outputs.artifacts }}
        run: |
          tasks=()
          if [[ "$TEST_NATIVE" == true ]]; then tasks+=(check:native test:native); fi
          if [[ "$TEST_E2E" == true ]]; then tasks+=(test:e2e); fi
          if [[ "$TEST_DEV" == true ]]; then tasks+=(test:dev); fi
          if [[ "$TEST_ARTIFACTS" == true ]]; then tasks+=(test:artifacts); fi
          if [[ ${#tasks[@]} == 0 ]]; then exit 0; fi
          prefix=()
          if [[ "$RUNNER_OS" == Linux ]]; then
            export XDG_SESSION_TYPE=x11
            prefix=(xvfb-run --auto-servernum sh -c 'openbox & exec "$@"' sh)
          fi
          "${prefix[@]}" pnpm exec turbo run "${tasks[@]}" --filter=@kisaki3/desktop --concurrency=1
      - name: Save Turbo cache
        if: steps.turbo-cache.outputs.cache-hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .turbo/cache
          key: ${{ steps.turbo-cache.outputs.cache-primary-key }}
      - name: Upload desktop artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: desktop-${{ matrix.target }}
          path: |-
            test-results/verification/
            test-results/consumers/
            clients/desktop/packages/*/out/package/
            packages/tooling/test-results/
            clients/desktop/app/test-results/
            clients/desktop/app/dist/${{ matrix.target }}/artifacts.json
            clients/desktop/app/dist/${{ matrix.target }}/Kisaki-*
            clients/desktop/app/dist/${{ matrix.target }}/*.yml
          if-no-files-found: error
      - name: Confirm selected checks completed
        id: verified
        shell: bash
        run: echo "verified=true" >> "$GITHUB_OUTPUT"
