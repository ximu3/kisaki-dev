# Validates PR titles and committed main-branch titles with the shared commit rules.

name: Commit titles

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Optional cache restoration should fall back before consuming the feedback budget.
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'

concurrency:
  group: commit-title-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  title:
    name: ${{ github.event_name == 'pull_request' && 'PR title' || 'Commit title' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          cache: true
      - name: Install title-check dependencies
        run: pnpm install --filter @kisaki3/workspace --frozen-lockfile --ignore-scripts
      - name: Check PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint
      - name: Check commit title
        if: github.event_name == 'push'
        run: git log -1 --format=%s | pnpm exec commitlint
