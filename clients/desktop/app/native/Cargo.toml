# Declares the private desktop Node-API library, platform dependencies and release profile.

[package]
name = "kisaki-native"
version = "0.1.0-dev.0"
edition = "2024"
rust-version = "1.90"
license = "AGPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "=3.15.0", default-features = false, features = ["napi8", "dyn-symbols"] }
napi-derive = "=3.6.13"

[build-dependencies]
napi-build = "=2.6.0"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.186"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[profile.release]
lto = true
strip = "symbols"
