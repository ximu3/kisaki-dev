query Verification($base: String!, $head: String!) {
  affectedTasks(
    base: $base
    head: $head
    tasks: [
      "test"
      "check:package"
      "desktop:packages:test:consumers:prepared"
      "test:browser"
      "test:native"
      "test:e2e"
      "test:dev"
      "test:performance"
      "test:artifacts"
      "package"
    ]
  ) {
    items {
      name
      fullName
      command
      package {
        name
        path
      }
      reason {
        __typename
      }
    }
  }
}
