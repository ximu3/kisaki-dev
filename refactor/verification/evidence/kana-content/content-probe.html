<!doctype html>
<meta charset="utf-8" />
<title>Kana content and view proof</title>
<style>
  body {
    margin: 0;
    background: white;
  }
  #toolbar {
    height: 56px;
    background: #ff00ff;
  }
  #viewport {
    position: relative;
    margin: 24px;
    height: 450px;
    overflow: hidden;
    background: #eeeeee;
  }
  #clip {
    position: absolute;
    left: 42px;
    top: 26px;
    overflow: hidden;
  }
  #page {
    width: 400px;
    height: 300px;
    transform-origin: 0 0;
  }
  #overlay {
    position: absolute;
    inset: 0;
    background: #ff00ff;
  }
  #text {
    position: fixed;
    left: -9000px;
    top: 0;
    width: 600px;
    height: 400px;
    border: 0;
  }
</style>
<div id="toolbar"></div>
<div id="viewport">
  <div id="clip">
    <svg
      id="page"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 400 300"
    >
      <rect
        id="first"
        x="0"
        y="0"
        width="200"
        height="150"
        fill="#777777"
      />
      <rect
        x="200"
        y="0"
        width="200"
        height="150"
        fill="#238823"
      />
      <rect
        x="0"
        y="150"
        width="200"
        height="150"
        fill="#243dcc"
      />
      <rect
        x="200"
        y="150"
        width="200"
        height="150"
        fill="#decc21"
      />
      <rect
        id="target"
        x="100"
        y="75"
        width="60"
        height="45"
        fill="#c62828"
      />
    </svg>
    <div id="overlay"></div>
  </div>
</div>
<iframe
  id="text"
  sandbox="allow-same-origin"
></iframe>
<script
  type="module"
  src="content-probe.mjs"
></script>
