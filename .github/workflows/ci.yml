# Runs code verification for pull request commits, main pushes and manual requests.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/verification.yml
    with:
      base: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
      head: ${{ github.sha }}
      complete: ${{ github.event_name == 'workflow_dispatch' }}
