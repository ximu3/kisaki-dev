name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # Retargeting changes the merge base; title and body edits do not request code checks.
    if: github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/verification.yml
