name: PR title

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  title:
    name: PR title
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Check the current squash title
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          title=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" --jq .title)
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([^()]+\))?!?: [^[:space:]].*'
          if ! [[ "$title" =~ $pattern && ${#title} -le 100 && "$title" != *. ]]; then
            echo 'Use a conventional squash title, up to 100 characters, with a subject and no trailing period.'
            exit 1
          fi
      - name: Accept titles checked on the member PRs
        if: github.event_name == 'merge_group'
        run: echo 'Each member PR passed its title check before entering the merge queue.'
