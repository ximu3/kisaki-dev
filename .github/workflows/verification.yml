name: Verification
on:
  workflow_call:
    inputs:
      base:
        description: Git revision to compare against; missing baselines request complete checks.
        type: string
        default: ''
      head:
        description: Exact Git revision to check out and verify.
        type: string
        required: true
      complete:
        description: Run every applicable check owned by this workflow.
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  repository:
    name: Repository
    uses: ./.github/workflows/verification-repository.yml
    with:
      base: ${{ inputs.base }}
      head: ${{ inputs.head }}
      complete: ${{ inputs.complete }}
  desktop:
    name: Desktop
    uses: ./.github/workflows/verification-desktop.yml
    with:
      base: ${{ inputs.base }}
      head: ${{ inputs.head }}
      complete: ${{ inputs.complete }}
  required:
    name: Required checks
    if: always()
    needs:
      - repository
      - desktop
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Check required results
        env:
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          DESKTOP_WORKFLOW_RESULT: ${{ needs.desktop.result }}
          DESKTOP_SELECTED: ${{ needs.desktop.outputs.selected }}
          DESKTOP_VERIFIED: ${{ needs.desktop.outputs.verified }}
        run: |
          test "$REPOSITORY_RESULT" = success
          test "$DESKTOP_WORKFLOW_RESULT" = success
          # Workflow success covers every matrix child; the marker distinguishes execution from skipping.
          if [ "$DESKTOP_SELECTED" = true ]; then
            test "$DESKTOP_VERIFIED" = true
          else
            test "$DESKTOP_SELECTED" = false
            test -z "$DESKTOP_VERIFIED"
          fi
