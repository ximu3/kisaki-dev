[package]
name = "kisaki-native"
version = "0.1.0-dev.0"
edition = "2024"
rust-version = "1.90"
license = "AGPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
font-kit = "0.14.3"
icu_collator = "2.4.0"
icu_locale_core = { version = "2.4.0", features = ["alloc"] }
napi = { version = "3.16.3", default-features = false, features = ["napi8", "dyn-symbols"] }
napi-derive = "3.7.2"
rusqlite = { version = "0.43.0", default-features = false, features = ["collation", "functions", "loadable_extension"] }

[build-dependencies]
cc = "1.11.3"
napi-build = "2.7.0"
toml = { version = "1.2.3", default-features = false, features = ["std", "parse", "serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[profile.release]
lto = true
strip = "symbols"
