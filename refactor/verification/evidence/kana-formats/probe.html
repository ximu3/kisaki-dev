<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kana format source proofs</title>
  </head>
  <body>
    <script>
      globalThis.runProof = (mode) =>
        new Promise((resolve, reject) => {
          const worker = new Worker('/probe-worker.mjs', { type: 'module' })
          const timer = setTimeout(() => {
            worker.terminate()
            reject(new Error('Format proof timed out'))
          }, 45000)
          worker.onmessage = ({ data }) => {
            clearTimeout(timer)
            worker.terminate()
            data.error ? reject(new Error(data.error)) : resolve(data)
          }
          worker.onerror = () => {
            clearTimeout(timer)
            worker.terminate()
            reject(new Error('Format proof worker failed'))
          }
          worker.postMessage(mode)
        })
    </script>
  </body>
</html>
