npmRebuild: false

files:
  - '!node_modules/**'
  - main/**
  - preload/**
  - renderer/**
  - extension-host/**
  - package.json
  - distribution.json
  - build.json
  - LICENSE

electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false

win:
  target: [nsis, zip]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

mac:
  target: [dmg, zip]
  forceCodeSigning: true
  notarize: false

linux:
  target: [deb, rpm, AppImage]
  category: Utility
  syncDesktopName: true
appImage:
  # AppRun alone owns the upstream namespace compatibility decision.
  executableArgs: []

publish:
  provider: github
  owner: ximu3
  repo: kisaki
