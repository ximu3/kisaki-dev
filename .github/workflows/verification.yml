name: Verification
on:
  workflow_call:
    inputs:
      base:
        description: Git revision to compare against; missing baselines request complete checks.
        type: string
        default: ''
      head:
        description: Exact Git revision to check out and verify.
        type: string
        required: true
      complete:
        description: Run every applicable check owned by this workflow.
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  repository:
    name: Repository
    uses: ./.github/workflows/verification-repository.yml
    with:
      base: ${{ inputs.base }}
      head: ${{ inputs.head }}
      complete: ${{ inputs.complete }}
  desktop:
    name: Desktop
    uses: ./.github/workflows/verification-desktop.yml
    with:
      base: ${{ inputs.base }}
      head: ${{ inputs.head }}
      complete: ${{ inputs.complete }}
  required:
    name: Required checks
    if: always()
    needs:
      - repository
      - desktop
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Check required results
        env:
          PROJECT_RESULTS: ${{ toJSON(needs) }}
        run: |
          # Workflow success covers every matrix child; markers distinguish execution from skipping.
          jq -e 'all(.[];
            .result == "success" and
            ((.outputs.selected == "true" and .outputs.verified == "true") or
             (.outputs.selected == "false" and (.outputs.verified // "") == "")))' <<< "$PROJECT_RESULTS"
