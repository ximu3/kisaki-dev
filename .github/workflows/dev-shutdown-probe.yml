name: Development shutdown probe

on:
  push:
    branches: [codex/dev-shutdown-failure]

permissions:
  contents: read

concurrency:
  group: dev-shutdown-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shutdown:
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 25
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      DESKTOP_TARGET: linux-arm64
      XDG_SESSION_TYPE: x11
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          architecture: arm64
          package-manager-cache: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y xvfb openbox wmctrl
      - run: pnpm --filter @kisaki3/desktop exec playwright install --with-deps chromium
      - run: pnpm exec turbo run build:native prepare:resources --filter=@kisaki3/desktop --concurrency=1
      - name: Exercise development shutdown repeatedly
        run: xvfb-run --auto-servernum sh -c 'openbox & exec "$@"' sh pnpm --filter @kisaki3/desktop test:dev --repeats=9
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: dev-shutdown-linux-arm64
          path: clients/desktop/app/test-results/dev/
          if-no-files-found: error
