name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    runs-on: ubuntu-22.04
    outputs:
      desktop: ${{ steps.affected.outputs.desktop }}
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      TURBO_SCM_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore Turbo task results
        id: turbo-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .turbo/cache
          key: turbo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.node-version') }}-${{ github.sha }}-${{ github.job }}
          restore-keys: |
            turbo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.node-version') }}-
      - name: Select desktop work from the real dependency graph
        id: affected
        shell: bash
        run: |
          if [[ -z "$TURBO_SCM_BASE" || "$TURBO_SCM_BASE" == 0000000000000000000000000000000000000000 ]]; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
          else
            pnpm exec turbo run build --filter=@kisaki3/desktop --affected --dry=json > "$RUNNER_TEMP/desktop-affected.json"
            echo "desktop=$(jq -r 'any(.tasks[]; .package == "@kisaki3/desktop")' "$RUNNER_TEMP/desktop-affected.json")" >> "$GITHUB_OUTPUT"
          fi
      - name: Check the pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint
      - name: Check the main commit title
        if: github.event_name == 'push'
        run: git log -1 --format=%s | pnpm exec commitlint
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:consumers
      - name: Save Turbo task results
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .turbo/cache
          key: ${{ steps.turbo-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: repository-verification
          path: |
            test-results/
            artifacts/packages/
          if-no-files-found: error

  desktop:
    needs: repository
    if: needs.repository.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: windows-x64, runner: windows-2025, arch: x64 }
          - { target: windows-arm64, runner: windows-11-arm, arch: arm64 }
          - { target: macos-x64, runner: macos-15-intel, arch: x64 }
          - { target: macos-arm64, runner: macos-15, arch: arm64 }
          - { target: linux-x64, runner: ubuntu-22.04, arch: x64 }
          - { target: linux-arm64, runner: ubuntu-22.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      DESKTOP_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          architecture: ${{ matrix.arch }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore Turbo task results
        id: turbo-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .turbo/cache
          key: turbo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.node-version') }}-${{ github.sha }}-${{ github.job }}
          restore-keys: |
            turbo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.node-version') }}-
      - name: Prepare Linux desktop tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb openbox wmctrl libfuse2 rpm
      - run: pnpm --filter @kisaki3/desktop exec playwright install --with-deps chromium
      - name: Check candidate adoption and command cancellation on the actual target
        run: pnpm --filter @kisaki3/tooling test
      - run: pnpm --filter @kisaki3/desktop native:check
      - name: Build the actual target
        shell: bash
        run: pnpm desktop:build --target "$DESKTOP_TARGET"
      - run: pnpm --filter @kisaki3/desktop test:native
      - run: pnpm --filter @kisaki3/desktop test:browser
      - name: Check native desktop workflows
        if: runner.os != 'Linux'
        run: pnpm --filter @kisaki3/desktop test:e2e && pnpm --filter @kisaki3/desktop test:dev && pnpm --filter @kisaki3/desktop test:performance
      - name: Check X11 desktop workflows
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm --filter @kisaki3/desktop test:e2e && xvfb-run --auto-servernum pnpm --filter @kisaki3/desktop test:dev && xvfb-run --auto-servernum pnpm --filter @kisaki3/desktop test:performance
      - name: Package the candidate
        shell: bash
        run: pnpm desktop:package --target "$DESKTOP_TARGET" --test-only
      - name: Observe the hardened native candidate
        if: runner.os != 'Linux'
        run: pnpm desktop:test:artifacts
      - name: Observe the hardened X11 candidate
        if: runner.os == 'Linux'
        env:
          XDG_SESSION_TYPE: x11
        run: xvfb-run --auto-servernum sh -c 'openbox & pnpm desktop:test:artifacts'
      - name: Save Turbo task results
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .turbo/cache
          key: ${{ steps.turbo-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: desktop-${{ matrix.target }}
          path: |
            clients/desktop/app/test-results/
            clients/desktop/app/dist/${{ matrix.target }}/artifacts.json
            clients/desktop/app/dist/${{ matrix.target }}/Kisaki-*
            clients/desktop/app/dist/${{ matrix.target }}/*.yml
          if-no-files-found: error

  required:
    name: Required checks
    if: always()
    needs: [repository, desktop]
    runs-on: ubuntu-22.04
    steps:
      - name: Require every selected job to finish successfully
        env:
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          DESKTOP_SELECTED: ${{ needs.repository.outputs.desktop }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
        run: |
          test "$REPOSITORY_RESULT" = success
          if [ "$DESKTOP_SELECTED" = true ]; then
            test "$DESKTOP_RESULT" = success
          else
            test "$DESKTOP_SELECTED" = false
            test "$DESKTOP_RESULT" = skipped
          fi
