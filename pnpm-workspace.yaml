packages:
  - packages/*
  - clients/desktop/app
  - clients/desktop/packages/*
autoInstallPeers: false

catalog:
  '@eslint/js': 10.0.1
  '@types/node': 24.19.2
  electron: 45.0.0
  eslint: 10.13.0
  jiti: 2.7.0
  solid-js: 1.9.16
  tsx: 4.23.15
  typescript: 6.0.3
  typescript-eslint: 8.72.0
  vite: 8.3.3
  vite-plugin-solid: 2.11.14
  vitest: 5.0.5

allowBuilds:
  '@parcel/watcher': false
  better-sqlite3: false
  electron: true
  electron-winstaller: false
  esbuild: true
  sharp: true

minimumReleaseAgeExclude:
  # This exact ZIP release passed the streamed-size and cancellation checks.
  - '@zip.js/zip.js@2.25.0'
