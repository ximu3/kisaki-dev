name: Verification

on:
  workflow_call:
    inputs:
      complete:
        description: Run all configured checks for every desktop target, including performance samples.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      desktop: ${{ steps.affected.outputs.desktop }}
      native: ${{ steps.affected.outputs.native }}
      e2e: ${{ steps.affected.outputs.e2e }}
      dev: ${{ steps.affected.outputs.dev }}
      performance: ${{ steps.affected.outputs.performance }}
      artifacts: ${{ steps.affected.outputs.artifacts }}
      tooling: ${{ steps.affected.outputs.tooling }}
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      TURBO_CONCURRENCY: '2'
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      TURBO_SCM_HEAD: ${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore Turbo cache
        id: turbo-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .turbo/cache
          key: turbo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.node-version') }}-${{ github.sha }}-${{ github.job }}
          restore-keys: |
            turbo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.node-version') }}-
      - name: Select checks
        id: affected
        shell: bash
        env:
          REQUEST_COMPLETE: ${{ inputs.complete }}
        run: |
          complete="$REQUEST_COMPLETE"
          if [[ -z "$TURBO_SCM_BASE" || "$TURBO_SCM_BASE" == 0000000000000000000000000000000000000000 ]] || ! git cat-file -e "$TURBO_SCM_BASE^{commit}"; then
            complete=true
          fi
          mkdir -p test-results/verification
          report=test-results/verification/affected.json
          if [[ "$complete" == false ]]; then
            jq -n --arg base "$TURBO_SCM_BASE" --arg head "$TURBO_SCM_HEAD" '{base: $base, head: $head}' > "$RUNNER_TEMP/verification-refs.json"
            pnpm exec turbo query config/turbo/verification.graphql --variables "$RUNNER_TEMP/verification-refs.json" > "$report"
            jq -e '.errors == null and (.data.affectedTasks.items | type == "array")' "$report" > /dev/null
            if jq -e 'any(.data.affectedTasks.items[]; .reason.__typename == "TaskAllChanged" or .reason.__typename == "TaskGlobalFileChanged" or .reason.__typename == "TaskGlobalDepsChanged")' "$report" > /dev/null; then
              complete=true
            fi
          else
            jq -n '{complete: true}' > "$report"
          fi
          echo "complete=$complete" >> "$GITHUB_OUTPUT"
          for task in native browser e2e dev performance artifacts; do
            selected="$complete"
            if [[ "$complete" == false ]]; then
              selected=$(jq -r --arg task "test:$task" 'any(.data.affectedTasks.items[]; .command != null and .package.name == "@kisaki3/desktop" and (.name == $task or ($task == "test:artifacts" and .name == "package")))' "$report")
            fi
            echo "$task=$selected" >> "$GITHUB_OUTPUT"
            if [[ "$task" != browser && "$selected" == true ]]; then desktop=true; fi
          done
          consumers="$complete"
          tooling="$complete"
          if [[ "$complete" == false ]]; then
            consumers=$(jq -r 'any(.data.affectedTasks.items[]; .command != null and (.fullName == "//#test:consumers:run" or (.name == "test:consumers" and (.package.path | startswith("clients/desktop/packages/")))))' "$report")
            tooling=$(jq -r 'any(.data.affectedTasks.items[]; .fullName == "@kisaki3/tooling#test" and .command != null)' "$report")
          fi
          if [[ "$tooling" == true ]]; then desktop=true; fi
          echo "consumers=$consumers" >> "$GITHUB_OUTPUT"
          echo "tooling=$tooling" >> "$GITHUB_OUTPUT"
          echo "desktop=${desktop:-false}" >> "$GITHUB_OUTPUT"
      - name: Check commit title
        if: github.event_name == 'push'
        run: git log -1 --format=%s | pnpm exec commitlint
      - name: Check repository
        shell: bash
        env:
          COMPLETE: ${{ steps.affected.outputs.complete }}
        run: |
          selection=()
          if [[ "$COMPLETE" == false ]]; then selection=(--affected); fi
          pnpm typecheck "${selection[@]}" --log-order=stream
          pnpm lint "${selection[@]}" --log-order=stream
          pnpm format:check
          pnpm test "${selection[@]}" --log-order=stream
      - name: Install Chromium
        if: steps.affected.outputs.consumers == 'true' || steps.affected.outputs.browser == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Test public package consumers
        if: steps.affected.outputs.consumers == 'true'
        run: pnpm test:consumers
      - name: Test browser interactions
        if: steps.affected.outputs.browser == 'true'
        run: pnpm desktop:test:browser --reporter=default --reporter=json --outputFile=test-results/browser/results.json
      - name: Save Turbo cache
        if: steps.turbo-cache.outputs.cache-hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .turbo/cache
          key: ${{ steps.turbo-cache.outputs.cache-primary-key }}
      - name: Upload verification artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: repository-verification
          path: |
            test-results/
            clients/desktop/app/test-results/browser/
            artifacts/packages/
          if-no-files-found: error

  desktop:
    name: Desktop (${{ matrix.target }})
    needs: repository
    if: needs.repository.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: windows-x64, runner: windows-2025, arch: x64 }
          - { target: windows-arm64, runner: windows-11-arm, arch: arm64 }
          - { target: macos-x64, runner: macos-15-intel, arch: x64 }
          - { target: macos-arm64, runner: macos-15, arch: arm64 }
          - { target: linux-x64, runner: ubuntu-22.04, arch: x64 }
          - { target: linux-arm64, runner: ubuntu-22.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      DESKTOP_TARGET: ${{ matrix.target }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          architecture: ${{ matrix.arch }}
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - name: Configure macOS deployment target
        if: runner.os == 'macOS'
        run: echo "MACOSX_DEPLOYMENT_TARGET=13.0" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore Turbo cache
        id: turbo-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .turbo/cache
          key: turbo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.node-version') }}-${{ github.sha }}-${{ github.job }}
          restore-keys: |
            turbo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.node-version') }}-
      - name: Install Linux desktop tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb openbox wmctrl libfuse2 rpm
      - name: Install Chromium
        if: needs.repository.outputs.dev == 'true'
        run: pnpm --filter @kisaki3/desktop exec playwright install --with-deps chromium
      - name: Test tooling
        if: needs.repository.outputs.tooling == 'true'
        run: pnpm --filter @kisaki3/tooling test --reporter=default --reporter=json --outputFile=test-results/results.json
      - name: Check native source
        if: needs.repository.outputs.native == 'true'
        run: pnpm --filter @kisaki3/desktop native:check
      - name: Build desktop
        if: needs.repository.outputs.native == 'true' || needs.repository.outputs.e2e == 'true' || needs.repository.outputs.dev == 'true' || needs.repository.outputs.performance == 'true'
        shell: bash
        run: pnpm desktop:build --target "$DESKTOP_TARGET"
      - name: Test native bindings and database
        if: needs.repository.outputs.native == 'true'
        run: pnpm --filter @kisaki3/desktop test:native
      - name: Test desktop workflows
        shell: bash
        env:
          CHECK_E2E: ${{ needs.repository.outputs.e2e }}
          CHECK_DEV: ${{ needs.repository.outputs.dev }}
          CHECK_PERFORMANCE: ${{ needs.repository.outputs.performance }}
        run: |
          prefix=()
          if [[ "$RUNNER_OS" == Linux ]]; then
            prefix=(xvfb-run --auto-servernum sh -c 'openbox & exec "$@"' sh)
          fi
          for task in e2e dev performance; do
            case "$task" in
              e2e) selected="$CHECK_E2E" ;;
              dev) selected="$CHECK_DEV" ;;
              performance) selected="$CHECK_PERFORMANCE" ;;
            esac
            if [[ "$selected" == true ]]; then "${prefix[@]}" pnpm --filter @kisaki3/desktop "test:$task"; fi
          done
      - name: Package desktop
        if: needs.repository.outputs.artifacts == 'true'
        shell: bash
        run: pnpm desktop:package --target "$DESKTOP_TARGET" --test-only
      - name: Test packaged application
        if: needs.repository.outputs.artifacts == 'true' && runner.os != 'Linux'
        run: pnpm desktop:test:artifacts
      - name: Test packaged application (X11)
        if: needs.repository.outputs.artifacts == 'true' && runner.os == 'Linux'
        env:
          XDG_SESSION_TYPE: x11
        run: xvfb-run --auto-servernum sh -c 'openbox & pnpm desktop:test:artifacts'
      - name: Save Turbo cache
        if: steps.turbo-cache.outputs.cache-hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .turbo/cache
          key: ${{ steps.turbo-cache.outputs.cache-primary-key }}
      - name: Upload desktop artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: desktop-${{ matrix.target }}
          path: |
            packages/tooling/test-results/
            clients/desktop/app/test-results/
            clients/desktop/app/dist/${{ matrix.target }}/artifacts.json
            clients/desktop/app/dist/${{ matrix.target }}/Kisaki-*
            clients/desktop/app/dist/${{ matrix.target }}/*.yml
          if-no-files-found: error

  required:
    name: Required checks
    if: always()
    needs: [repository, desktop]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Check required results
        env:
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          DESKTOP_SELECTED: ${{ needs.repository.outputs.desktop }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
        run: |
          test "$REPOSITORY_RESULT" = success
          if [ "$DESKTOP_SELECTED" = true ]; then
            test "$DESKTOP_RESULT" = success
          else
            test "$DESKTOP_SELECTED" = false
            test "$DESKTOP_RESULT" = skipped
          fi
